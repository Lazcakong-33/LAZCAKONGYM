name: Automatic OTA staging preparation
on:
  push:
    branches: ['fix/coach-7.0.1']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ota-staging-sequential
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/fix/coach-7.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify web-only changes against APK baseline
        run: |
          set -euo pipefail
          git diff --name-only 6683b2f2c99dc766aea816da506e580f20ed3dd2 HEAD
          if git diff --name-only 6683b2f2c99dc766aea816da506e580f20ed3dd2 HEAD | grep -E '^(android/|ios/|capacitor\.config\.|package(-lock)?\.json|firestore.*\.rules)'; then
            echo "::error::Native or security changes require separate validation."
            exit 1
          fi
      - name: Allocate immutable next staging version
        run: |
          set -euo pipefail
          git fetch --tags
          existing="$(git tag --points-at HEAD --list 'ota-staging-v7.0.*' | grep -E '^ota-staging-v7\.0\.[0-9]+
      - run: npm run lint
      - name: Coach, authentication and OTA regression tests
        env:
          CI_ANDROID_ONLY: 'true'
          OTA_PRODUCTION_ENABLED: 'false'
        run: |
          set -euo pipefail
          npx tsx --test src/server/__tests__/coachLocalRecovery701.test.ts src/server/__tests__/trainingCycleHome702.test.ts src/server/__tests__/stagingReleaseDiscovery.test.ts
          for suite in adminAccessRepairSuite coachChatRecoverySuite coachLaunchReadinessSuite coachNoHangSuite otaUpdateSystemSuite offlineProductionReadinessSuite; do
            npx tsx "src/server/__tests__/$suite.ts"
          done
      - name: Build staging web assets
        env:
          VITE_API_BASE_URL: https://lazcakongym.ai.studio
          VITE_GOOGLE_WEB_CLIENT_ID: 13537846485-8j7931cki5gtlpq2eklsru35765sv3pq.apps.googleusercontent.com
          VITE_OTA_CHANNEL: staging
          VITE_OTA_PRODUCTION_ENABLED: 'false'
        run: npm run build
      - name: Prepare staging OTA artifact (not published)
        env:
          OTA_PRODUCTION_ENABLED: 'false'
        run: |
          set -euo pipefail
          npm run ota:package -- --version "$OTA_VERSION" --channel staging --min-native 70000 --bundle-base-url "https://github.com/Lazcakong-33/LAZCAKONGYM/releases/download/ota-staging-v$OTA_VERSION" --notes "$OTA_RELEASE_NOTES"
          unzip -tq "dist-ota/lazcakongym-ota-$OTA_VERSION.zip"
          (cd dist-ota && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ota-staging-package
          path: dist-ota/
          retention-days: 14
  host:
    needs: validate
    if: github.ref == 'refs/heads/fix/coach-7.0.1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ota-staging-package
          path: verified
      - name: Verify and host immutable staging prerelease (no channel activation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd verified
          sha256sum -c SHA256SUMS.txt
          version="$(python -c 'import json; print(json.load(open("manifest.staging.json"))["version"])')"
          [[ "$version" =~ ^7\.0\.[0-9]+$ ]]
          tag="ota-staging-v$version"
          zip="lazcakongym-ota-$version.zip"
          unzip -tq "$zip"
          python - <<'PY'
          import json, zipfile, pathlib, hashlib, re
          m=json.loads(pathlib.Path('manifest.staging.json').read_text())
          version=m['version']
          assert re.fullmatch(r'7\.0\.\d+',version)
          p=pathlib.Path('lazcakongym-ota-'+version+'.zip')
          assert m['channel']=='staging' and m['minNativeVersionCode']==70000 and not m['requiresApkUpdate']
          assert m['checksum']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert m['url']=='https://github.com/Lazcakong-33/LAZCAKONGYM/releases/download/ota-staging-v'+version+'/'+p.name
          with zipfile.ZipFile(p) as z:
              for f in z.namelist():
                  assert not f.startswith('/') and '..' not in pathlib.PurePosixPath(f).parts
                  assert not any(x.startswith('.env') or x in ('google-services.json','serviceAccountKey.json') or x.endswith(('.pem','.keystore','.jks','.p12')) for x in pathlib.PurePosixPath(f).parts), f
          PY
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Already hosted; refusing to overwrite immutable release."
            exit 0
          fi
          printf 'Validated staging package. No channel activation.\n\n<!-- LAZCAKONG_STAGING_MANIFEST_BASE64:%s -->\n' "$(base64 -w0 manifest.staging.json)" > release-notes.txt
          gh release create "$tag" "$zip" manifest.staging.json SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LAZCAKONG GYM $version - staging" --notes-file release-notes.txt --prerelease --latest=false
          mkdir downloaded
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$zip" --dir downloaded
          cmp "downloaded/$zip" "$zip"
