name: Validate AI Studio invitation integration
on:
  push:
    branches: ['integration/aistudio-7.0.5-invites']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aistudio-invites-validation
  cancel-in-progress: true
jobs:
  validate:
    if: github.ref == 'refs/heads/integration/aistudio-7.0.5-invites'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      OTA_PRODUCTION_ENABLED: 'false'
      CI_ANDROID_ONLY: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - name: Test Firestore rules in isolated demo emulator
        run: |
          set -euo pipefail
          npm install -g firebase-tools
          firebase emulators:exec --config firebase.json --only firestore,auth --project demo-lazcakongym-test "npm run test:rules"
          firebase emulators:exec --config firebase.contingency.json --only firestore,auth --project demo-lazcakongym-test "npm run test:rules:contingency"
      - name: Regression tests
        run: |
          set -euo pipefail
          npx tsx --test src/server/__tests__/coachLocalRecovery701.test.ts src/server/__tests__/trainingCycleHome702.test.ts src/server/__tests__/stagingReleaseDiscovery.test.ts src/server/__tests__/coachGeneralGuidance705.test.ts src/server/__tests__/coachRequestBudget705.test.ts
          npx jest --runInBand --runTestsByPath src/server/__tests__/recoveryBatchFixes.test.ts
      - name: Build candidate web assets
        env:
          VITE_APP_VERSION: '7.0.6'
          VITE_OTA_CHANNEL: staging
          VITE_OTA_PRODUCTION_ENABLED: 'false'
        run: npm run build
      - name: Package isolated staging candidate (not a release)
        run: |
          set -euo pipefail
          npm run ota:package -- --version 7.0.6 --channel staging --min-native 70000 --notes "Invitation repair validation candidate; do not distribute"
          unzip -tq dist-ota/lazcakongym-ota-7.0.6.zip
          (cd dist-ota && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: invitation-staging-validation-only
          path: dist-ota/
          retention-days: 7
