name: Cloudflare isolated app preview

on:
  push:
    branches: [migration/zero-cost]

permissions:
  contents: read

concurrency:
  group: lazcakong-cloudflare-app-preview
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_PREVIEW_FIREBASE_CONFIG: '{"projectId":"demo-lazcakong","authDomain":"demo-lazcakong.firebaseapp.com","appId":"test-web","apiKey":"placeholder"}'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/zero-cost-cloudflare-smoke.test.mjs scripts/zero-cost-guard.test.mjs
      - run: npm run build -- --mode cloudflare-preview
      - run: npx --yes wrangler@4.168.0 deploy --dry-run --config wrangler.app-preview.jsonc

  deploy:
    needs: validate
    if: ${{ vars.LAZCAKONG_DEPLOY_ISOLATED_PREVIEW == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-app-preview
    env:
      VITE_PREVIEW_FIREBASE_CONFIG: ${{ vars.LAZCAKONG_PREVIEW_FIREBASE_CONFIG }}
      VITE_PREVIEW_OTA_VERSION: ${{ vars.LAZCAKONG_PREVIEW_OTA_VERSION || '6.4.12' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.LAZCAKONG_PREVIEW_CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build isolated preview and optional OTA bundle
        run: |
          set -euo pipefail
          if [[ -n "$VITE_PREVIEW_OTA_VERSION" && ! "$VITE_PREVIEW_OTA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "LAZCAKONG_PREVIEW_OTA_VERSION must be a numeric version (major.minor.patch)."
            exit 1
          fi
          export VITE_APP_VERSION="$VITE_PREVIEW_OTA_VERSION"
          export VITE_API_BASE_URL=https://lazcakong-gym-app-preview.kmiloko19.workers.dev
          npm run build -- --mode cloudflare-preview
          if [[ -n "$VITE_PREVIEW_OTA_VERSION" ]]; then
            work="$(mktemp -d)"
            ln -s "$GITHUB_WORKSPACE/dist-app-preview" "$work/dist"
            (
              cd "$work"
              node "$GITHUB_WORKSPACE/scripts/package-ota-bundle.mjs" \
                --version "$VITE_PREVIEW_OTA_VERSION" --channel development \
                --base-url "$VITE_API_BASE_URL"
            )
            zip="$work/dist-ota/lazcakongym-ota-$VITE_PREVIEW_OTA_VERSION.zip"
            test "$(wc -c < "$zip")" -le 26214400
            mkdir -p dist-app-preview/_preview-ota
            cp "$zip" "$work/dist-ota/manifest.development.json" dist-app-preview/_preview-ota/
          fi
      - name: Deploy isolated preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LAZCAKONG_PREVIEW_CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          preview_firebase_key="$(node -e 'const c=JSON.parse(process.env.VITE_PREVIEW_FIREBASE_CONFIG); if(c.projectId!=="lazcakong-zero-cost-test" || !c.apiKey) process.exit(1); process.stdout.write(c.apiKey)')"
          npx --yes wrangler@4.168.0 deploy --config wrangler.app-preview.jsonc --var "PREVIEW_FIREBASE_API_KEY:$preview_firebase_key"
