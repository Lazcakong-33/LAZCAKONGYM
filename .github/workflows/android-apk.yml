name: 'Android APK & OTA Bundle CI (LazcaKong Gym)'

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de APK a compilar (debug para pruebas, release requiere secrets de keystore)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      generate_dev_ota_bundle:
        description: 'Empaquetar también bundle ZIP OTA de desarrollo (no publica a producción)'
        required: false
        default: true
        type: boolean
      version_name:
        description: 'VersionName opcional para release (por defecto conserva 1.0)'
        required: false
        default: ''
        type: string
      version_code:
        description: 'VersionCode opcional numérico para release (por defecto conserva 1)'
        required: false
        default: ''
        type: string
  push:
    branches: [ "main", "master", "dev", "ci/**" ]
  pull_request:
    branches: [ "main", "master", "dev", "ci/**" ]

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Verification Suites
        env:
          CI_ANDROID_ONLY: 'true'
        run: |
          npx tsx src/server/__tests__/adminAccessRepairSuite.ts
          npx tsx src/server/__tests__/pwaStartupSessionSuite.ts
          npx tsx src/server/__tests__/nativeGoogleAuthSuite.ts
          npx tsx src/server/__tests__/nativeAndroidRestRepairSuite.ts
          npx tsx src/server/__tests__/nativeCapacitorStage7aSuite.ts
          npx tsx src/server/__tests__/offlineProductionReadinessSuite.ts
          npx tsx src/server/__tests__/otaUpdateSystemSuite.ts

      - name: Build Web Assets (Vite)
        env:
          VITE_API_BASE_URL: https://lazcakongym.ai.studio
          VITE_GOOGLE_WEB_CLIENT_ID: 13537846485-8j7931cki5gtlpq2eklsru35765sv3pq.apps.googleusercontent.com
          VITE_OTA_CHANNEL: development
          VITE_OTA_PRODUCTION_ENABLED: 'false'
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_TELEMETRY: 'off'
          CI: '1'
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36 & Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configure Optional google-services.json from Secret
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json restaurado desde secreto seguro."
          else
            echo "Sin secreto GOOGLE_SERVICES_JSON_BASE64; compilando sin archivo google-services.json."
          fi

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Default Testing Build)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        working-directory: android
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          LAZCAKONG_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          LAZCAKONG_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          LAZCAKONG_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ] && [ -n "${LAZCAKONG_DEBUG_KEYSTORE_PASSWORD:-}" ] && [ -n "${LAZCAKONG_DEBUG_KEY_ALIAS:-}" ] && [ -n "${LAZCAKONG_DEBUG_KEY_PASSWORD:-}" ]; then
            DEBUG_KS_TMP="${RUNNER_TEMP}/lazcakong-debug.keystore"
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$DEBUG_KS_TMP"
            export LAZCAKONG_DEBUG_KEYSTORE_FILE="$DEBUG_KS_TMP"
            echo "Debug keystore restaurado desde GitHub Secrets para conservar firma de Android Studio."
          else
            echo "AVISO: Sin secretos ANDROID_DEBUG_KEYSTORE_*; compilando con certificado debug temporal de CI (no actualizará encima de un APK debug firmado en otro PC sin desinstalar)."
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Decode Existing Release Keystore & Build Signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LAZCAKONG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAZCAKONG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAZCAKONG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LAZCAKONG_VERSION_CODE: ${{ inputs.version_code }}
          LAZCAKONG_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${LAZCAKONG_KEYSTORE_PASSWORD:-}" ] || [ -z "${LAZCAKONG_KEY_ALIAS:-}" ] || [ -z "${LAZCAKONG_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Faltan secretos de firma release (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            echo "No se generará ninguna clave nueva automáticamente."
            exit 1
          fi
          KEYSTORE_TMP="${RUNNER_TEMP}/lazcakong-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_TMP"
          export LAZCAKONG_KEYSTORE_FILE="$KEYSTORE_TMP"
          ./gradlew assembleRelease --no-daemon

      - name: Generate APK SHA-256 Checksum
        shell: bash
        run: |
          mkdir -p artifacts-apk
          if [ "${{ inputs.build_type }}" = "release" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "ERROR: No se encontró archivo APK compilado."
            exit 1
          fi
          cp "$APK_SRC" artifacts-apk/
          sha256sum artifacts-apk/*.apk > artifacts-apk/SHA256SUMS.txt
          ls -lh artifacts-apk

      - name: Upload APK as Downloadable Artifact (No Auto-Publish)
        uses: actions/upload-artifact@v4
        with:
          name: lazcakong-gym-apk-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
          path: artifacts-apk/
          retention-days: 14

      - name: Package Development OTA Bundle (Optional, Never Auto-Published to Prod)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.generate_dev_ota_bundle }}
        run: npm run ota:package -- --channel development

      - name: Upload Development OTA Artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.generate_dev_ota_bundle }}
        uses: actions/upload-artifact@v4
        with:
          name: lazcakong-gym-ota-development
          path: dist-ota/
          retention-days: 14

      - name: Cleanup Temporary Keystore & Sensitive Files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/lazcakong-debug.keystore" || true
          rm -f "${RUNNER_TEMP}/lazcakong-release.keystore" || true
          rm -f android/app/google-services.json || true
