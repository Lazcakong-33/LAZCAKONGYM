name: 'Android APK & OTA Bundle CI (LazcaKong Gym)'

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de APK a compilar (debug para pruebas, release requiere secrets de keystore)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      generate_dev_ota_bundle:
        description: 'Empaquetar también bundle ZIP OTA de desarrollo (no publica a producción)'
        required: false
        default: true
        type: boolean
      version_name:
        description: 'VersionName opcional para release (por defecto conserva 1.0)'
        required: false
        default: ''
        type: string
      version_code:
        description: 'VersionCode opcional numérico para release (por defecto conserva 1)'
        required: false
        default: ''
        type: string
  push:
    branches: [ "main", "master", "dev", "ci/**" ]
  pull_request:
    branches: [ "main", "master", "dev", "ci/**" ]

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript Lint Check
        run: npm run lint

      - name: Run Verification Suites
        env:
          CI_ANDROID_ONLY: 'true'
        run: |
          npx tsx src/server/__tests__/adminAccessRepairSuite.ts
          npx tsx src/server/__tests__/pwaStartupSessionSuite.ts
          npx tsx src/server/__tests__/nativeGoogleAuthSuite.ts
          npx tsx src/server/__tests__/nativeAndroidRestRepairSuite.ts
          npx tsx src/server/__tests__/nativeCapacitorStage7aSuite.ts
          npx tsx src/server/__tests__/offlineProductionReadinessSuite.ts
          npx tsx src/server/__tests__/otaUpdateSystemSuite.ts

      - name: Build Web Assets (Vite)
        env:
          VITE_API_BASE_URL: https://lazcakongym.ai.studio
          VITE_GOOGLE_WEB_CLIENT_ID: 13537846485-8j7931cki5gtlpq2eklsru35765sv3pq.apps.googleusercontent.com
          VITE_OTA_CHANNEL: development
          VITE_OTA_PRODUCTION_ENABLED: 'false'
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CAPACITOR_TELEMETRY: 'off'
          CI: '1'
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Android SDK 36 (GitHub hosted SDK, no obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK missing from GitHub runner (ANDROID_HOME / ANDROID_SDK_ROOT)."
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools missing: $SDKMANAGER"
            exit 1
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
          echo "Android SDK 36 and build tools 36.0.0 verified."

      - name: Configure Optional google-services.json from Secret
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
            echo "google-services.json restaurado desde secreto seguro."
          else
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 no está configurado; verificar cliente OAuth Android y registro de huellas en Firebase antes de dar Google Sign-In por listo."
          fi

      - name: Ensure Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Default Testing Build)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' }}
        working-directory: android
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          LAZCAKONG_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEYSTORE_PASSWORD }}
          LAZCAKONG_DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          LAZCAKONG_DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ] || [ -z "${LAZCAKONG_DEBUG_KEYSTORE_PASSWORD:-}" ] || [ -z "${LAZCAKONG_DEBUG_KEY_ALIAS:-}" ] || [ -z "${LAZCAKONG_DEBUG_KEY_PASSWORD:-}" ]; then
            echo "::error::Falta al menos uno de los cuatro secretos ANDROID_DEBUG_*; se rechaza la firma temporal."
            exit 1
          fi
          DEBUG_KS_TMP="${RUNNER_TEMP}/lazcakong-debug.keystore"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 -d > "$DEBUG_KS_TMP"
          export LAZCAKONG_DEBUG_KEYSTORE_FILE="$DEBUG_KS_TMP"
          if ! keytool -list -keystore "$DEBUG_KS_TMP" -storepass "$LAZCAKONG_DEBUG_KEYSTORE_PASSWORD" -alias "$LAZCAKONG_DEBUG_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::La firma debug no pudo validarse: comprueba alias, contraseña y archivo keystore de GitHub Secrets."
            exit 1
          fi
          echo "Certificado debug privado validado (sin exponer contraseñas); compilando con la firma configurada."
          echo "PUBLIC Android signing fingerprints for Firebase project configuration:"
          keytool -exportcert -rfc -keystore "$DEBUG_KS_TMP" -storepass "$LAZCAKONG_DEBUG_KEYSTORE_PASSWORD" -alias "$LAZCAKONG_DEBUG_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha1
          keytool -exportcert -rfc -keystore "$DEBUG_KS_TMP" -storepass "$LAZCAKONG_DEBUG_KEYSTORE_PASSWORD" -alias "$LAZCAKONG_DEBUG_KEY_ALIAS" | openssl x509 -noout -fingerprint -sha256
          ./gradlew assembleDebug --no-daemon

      - name: Decode Existing Release Keystore & Build Signed Release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_type == 'release' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          LAZCAKONG_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAZCAKONG_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAZCAKONG_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          LAZCAKONG_VERSION_CODE: ${{ inputs.version_code }}
          LAZCAKONG_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${LAZCAKONG_KEYSTORE_PASSWORD:-}" ] || [ -z "${LAZCAKONG_KEY_ALIAS:-}" ] || [ -z "${LAZCAKONG_KEY_PASSWORD:-}" ]; then
            echo "ERROR: Faltan secretos de firma release (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
            echo "No se generará ninguna clave nueva automáticamente."
            exit 1
          fi
          KEYSTORE_TMP="${RUNNER_TEMP}/lazcakong-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_TMP"
          export LAZCAKONG_KEYSTORE_FILE="$KEYSTORE_TMP"
          ./gradlew assembleRelease --no-daemon

      - name: Generate APK SHA-256 Checksum
        shell: bash
        run: |
          mkdir -p artifacts-apk
          if [ "${{ inputs.build_type }}" = "release" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APK_SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "ERROR: No se encontró archivo APK compilado."
            exit 1
          fi
          echo "Verifying APK integrity, signature and package ID..."
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK_SRC"
          "$SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK_SRC" | grep -F "package: name='com.lazcakong.gym'"
          unzip -tq "$APK_SRC" >/dev/null
          cp "$APK_SRC" artifacts-apk/
          sha256sum artifacts-apk/*.apk > artifacts-apk/SHA256SUMS.txt
          ls -lh artifacts-apk

      - name: Upload APK as Downloadable Artifact (No Auto-Publish)
        uses: actions/upload-artifact@v4
        with:
          name: lazcakong-gym-apk-${{ github.event_name == 'workflow_dispatch' && inputs.build_type || 'debug' }}
          path: artifacts-apk/
          retention-days: 14

      - name: Package Development OTA Bundle (Optional, Never Auto-Published to Prod)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.generate_dev_ota_bundle == true) || (github.event_name == 'push' && github.ref == 'refs/heads/ci/android-apk-ota') }}
        run: npm run ota:package -- --channel development

      - name: Upload Development OTA Artifact
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.generate_dev_ota_bundle == true) || (github.event_name == 'push' && github.ref == 'refs/heads/ci/android-apk-ota') }}
        uses: actions/upload-artifact@v4
        with:
          name: lazcakong-gym-ota-development
          path: dist-ota/
          retention-days: 14

      - name: Cleanup Temporary Keystore & Sensitive Files
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/lazcakong-debug.keystore" || true
          rm -f "${RUNNER_TEMP}/lazcakong-release.keystore" || true
          rm -f android/app/google-services.json || true


  # Independent development-only OTA hosting on GitHub Releases.
  # No Cloud Run deploy, no Firebase changes, no credentials beyond scoped GITHUB_TOKEN.
  publish-development-ota:
    name: Publish verified DEVELOPMENT OTA (GitHub Releases)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/ci/android-apk-ota' }}
    needs: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: lazcakong-ota-development
      cancel-in-progress: false

    steps:
      - name: Checkout current source (no production checkout)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Determine next unique development SemVer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only prereleases tagged ota-dev-v6.4.N count. First OTA is 6.4.5,
          # newer than the native 6.4.4 bootstrap APK.
          LATEST_PATCH=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '[.[].tagName | select(startswith("ota-dev-v6.4.")) | ltrimstr("ota-dev-v6.4.") | tonumber] | max // 4')
          NEXT_PATCH=$((LATEST_PATCH + 1))
          if [ "$NEXT_PATCH" -lt 5 ]; then NEXT_PATCH=5; fi
          OTA_VERSION="6.4.$NEXT_PATCH"
          echo "OTA_VERSION=$OTA_VERSION" >> "$GITHUB_ENV"
          echo "OTA_TAG=ota-dev-v$OTA_VERSION" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION=$OTA_VERSION" >> "$GITHUB_ENV"
          echo "Publishing development OTA version $OTA_VERSION"

      - name: Install dependencies and verify types
        run: |
          npm install --no-audit --no-fund
          npm run lint

      - name: Validate release changes never include native files
        shell: bash
        run: |
          set -euo pipefail
          # The native APK has already passed CI. OTA contains ONLY dist/ assets.
          # Publishing a bundle with native changes would mislead the client.
          # Explicit native changes are blocked from OTA and require APK.
          if ! git rev-parse "${GITHUB_SHA}^1" >/dev/null 2>&1; then
            echo "::error::Cannot inspect previous commit. Refusing unchecked OTA publishing."
            exit 1
          fi
          CHANGED=$(git diff --name-only "${GITHUB_SHA}^1" "${GITHUB_SHA}")
          if printf '%s\n' "$CHANGED" | grep -E '^(android/|ios/|capacitor\.config\.|package(-lock)?\.json)' ; then
            echo "::error::Native/package configuration changed. A full signed APK is required; refusing OTA publishing."
            exit 1
          fi

      - name: Build OTA web assets at exact version
        env:
          VITE_API_BASE_URL: https://lazcakongym.ai.studio
          VITE_GOOGLE_WEB_CLIENT_ID: 13537846485-8j7931cki5gtlpq2eklsru35765sv3pq.apps.googleusercontent.com
          VITE_OTA_CHANNEL: development
          VITE_OTA_PRODUCTION_ENABLED: 'false'
        run: npm run build

      - name: Package, verify and set immutable GitHub release URL
        shell: bash
        run: |
          set -euo pipefail
          npm run ota:package -- --channel development --version "$OTA_VERSION"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const tag = process.env.OTA_TAG;
          const version = process.env.OTA_VERSION;
          const zipName = `lazcakongym-ota-${version}.zip`;
          const zipPath = path.resolve('dist-ota', zipName);
          const manifestPath = path.resolve('dist-ota/manifest.development.json');
          const bundle = fs.readFileSync(zipPath);
          const checksum = crypto.createHash('sha256').update(bundle).digest('hex');
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (manifest.version !== version || manifest.checksum !== checksum || manifest.channel !== 'development') {
            throw new Error('Manifest/package mismatch; refusing development publication');
          }
          manifest.url = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${zipName}`;
          manifest.releaseNotes = 'LAZCAKONG GYM — actualización segura de interfaz y biblioteca, sin reinstalar APK.';
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          console.log(`Verified web-only OTA ${version} (SHA-256 ${checksum.slice(0, 12)}...)`);
          NODE

      - name: Publish development pre-release with permanent versioned ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Never use --clobber: immutable versioned releases are safer for checksums.
          gh release create "$OTA_TAG" "dist-ota/lazcakongym-ota-$OTA_VERSION.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LAZCAKONG GYM development OTA $OTA_VERSION" \
            --notes "Web-only development OTA. Not a production rollout. Android native changes require a separate APK." \
            --prerelease --latest=false

      - name: Download release asset and validate SHA-256 before publishing index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ota-verified"
          gh release download "$OTA_TAG" --repo "$GITHUB_REPOSITORY" \
            -p "lazcakongym-ota-$OTA_VERSION.zip" -D "$RUNNER_TEMP/ota-verified"
          sha256sum "dist-ota/lazcakongym-ota-$OTA_VERSION.zip"
          cmp "dist-ota/lazcakongym-ota-$OTA_VERSION.zip" \
            "$RUNNER_TEMP/ota-verified/lazcakongym-ota-$OTA_VERSION.zip"
          unzip -tq "$RUNNER_TEMP/ota-verified/lazcakongym-ota-$OTA_VERSION.zip"

      - name: Atomically update development manifest index (never main or production)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          INDEX_PATH="ota/manifest.development.json"
          INDEX_SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$INDEX_PATH?ref=ota-development" --jq '.sha')
          MANIFEST_BASE64=$(base64 -w0 dist-ota/manifest.development.json)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$INDEX_PATH" \
            -f "branch=ota-development" \
            -f "sha=$INDEX_SHA" \
            -f "message=publish: verified development OTA $OTA_VERSION" \
            -f "content=$MANIFEST_BASE64" \
            --jq '.commit.sha'
          echo "Development manifest index points to $OTA_TAG"
